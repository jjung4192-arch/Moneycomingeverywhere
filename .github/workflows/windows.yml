name: Build Windows app
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', '.github/workflows/windows.yml']
  workflow_dispatch:
concurrency:
  group: photobridge-windows
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check transfer logic
        run: dotnet run --project tests/PhotoBridge.Checks -c Release
      - name: Publish portable Windows x64 app
        run: dotnet publish src/PhotoBridge.Windows -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/PhotoBridge
      - name: Check Windows UI startup
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$pwd/artifacts/PhotoBridge/PhotoBridge.exe" -PassThru
          try {
            $visible = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Milliseconds 500
              $app.Refresh()
              if ($app.HasExited) { throw "App exited during startup: $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne 0) { $visible = $true; break }
            }
            if (-not $visible) { throw "App window did not appear" }
            Write-Output "Windows app window opened successfully"
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - name: Verify browse and selected-only import UI
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$pwd/artifacts/PhotoBridge/PhotoBridge.exe" -ArgumentList '--self-test' -PassThru
          try {
            if (-not $app.WaitForExit(60000)) { throw 'Selection UI check timed out' }
            if (Test-Path ui-checks.txt) { Get-Content ui-checks.txt }
            if ($app.ExitCode -ne 0) { throw 'Selection UI check failed' }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoBridge-Windows-x64
          path: artifacts/PhotoBridge/
          if-no-files-found: error
          retention-days: 14
      - name: Package download
        shell: pwsh
        run: Compress-Archive -Path artifacts/PhotoBridge/* -DestinationPath artifacts/PhotoBridge-Windows-x64.zip
      - name: Publish clearly labelled test build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $output = & gh release create "photobridge-preview-${{ github.run_number }}" artifacts/PhotoBridge-Windows-x64.zip --repo "${{ github.repository }}" --title "PhotoBridge 사진 선택 시험판 #${{ github.run_number }}" --prerelease --target "${{ github.sha }}" --notes-file RELEASE_NOTES.md 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            $message = $output.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Test release upload failed::$message"
            exit 1
          }
          Write-Output $output
